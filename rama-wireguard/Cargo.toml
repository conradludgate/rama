[package]
name = "rama-wireguard"
description = "WireGuard endpoints and UDP driver for rama"
version = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
keywords = ["io", "wireguard", "vpn", "network", "rama"]
categories = ["asynchronous", "network-programming"]
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
test-utils = ["rama-udp/test-utils"]
# Socket driver and typed endpoint handles.
runtime = ["dep:tokio", "dep:rand"]

[dependencies]
ahash = { workspace = true }
rama-core = { workspace = true }
rama-wireguard-proto = { workspace = true }
rama-net = { workspace = true }
rama-udp = { workspace = true }
rand = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "time", "sync"], optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tun-rs = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
zeroize = { workspace = true }
base64 = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["rt", "test-util"] }
tokio-test = { workspace = true }

[[example]]
name = "linux_tun"
required-features = ["runtime"]
